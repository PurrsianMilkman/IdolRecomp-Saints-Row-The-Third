# Team B portable build: every platform-independent library, tool and
# synthetic test suite under team-b/, built with GCC on Linux. The D3D11
# renderer and sr3_viewer stay behind if(WIN32) in team-b/CMakeLists.txt,
# so they are skipped here. The tests use synthetic inputs only - no game data.
name: team-b portable build

on:
  push:
    paths: ['team-b/**', '.github/workflows/team-b-portable.yml']
  pull_request:
    paths: ['team-b/**', '.github/workflows/team-b-portable.yml']
  workflow_dispatch:

jobs:
  gcc:
    name: GCC ${{ matrix.build_type }}${{ matrix.sanitize && ' + ASan/UBSan' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            sanitize: false
          - build_type: Debug
            sanitize: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: |
          FLAGS=""
          if [ "${{ matrix.sanitize }}" = "true" ]; then
            FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          fi
          cmake -S team-b -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
